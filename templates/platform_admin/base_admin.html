<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0F172A">
    <meta name="description" content="Abacash Platform Admin — Manage multi-tenant loan management system.">
    <title>{% block title %}Platform Admin — Abacash{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
      :root {
        --admin-surface: #FFFFFF;
        --admin-surface-2: #F8FAFC;
        --admin-surface-3: #EEF2F7;
        --admin-border: #E2E8F0;
        --admin-text-primary: #0F172A;
        --admin-text-secondary: #475569;
        --admin-text-muted: #94A3B8;
        --admin-accent: #3B82F6;
        --admin-accent-hover: #2563EB;
        --admin-accent-soft: rgba(59, 130, 246, 0.12);
        --admin-success: #10B981;
        --admin-danger: #EF4444;
        --admin-warning: #F59E0B;
        --admin-purple: #8B5CF6;
        --admin-radius: 10px;
        --admin-transition: 0.25s ease;
        --admin-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
        --admin-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --admin-sidebar-width: 240px;
        --admin-topbar-height: 60px;
        --admin-surface-rgb: 255, 255, 255;
      }

      [data-theme="dark"] {
        --admin-surface: #111827;
        --admin-surface-2: #1E293B;
        --admin-surface-3: #273449;
        --admin-border: #334155;
        --admin-text-primary: #F8FAFC;
        --admin-text-secondary: #94A3B8;
        --admin-text-muted: #64748B;
        --admin-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        --admin-surface-rgb: 17, 24, 39;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        font-family: var(--admin-font);
        background: var(--admin-surface-2);
        color: var(--admin-text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        transition: background var(--admin-transition), color var(--admin-transition);
      }
      a { text-decoration: none; color: var(--admin-accent); transition: color 0.2s; }
      a:hover { color: var(--admin-accent-hover); }

      /* Sidebar */
      .admin-sidebar {
        width: var(--admin-sidebar-width);
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        background: var(--admin-surface);
        border-right: 1px solid var(--admin-border);
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease, background var(--admin-transition), border-color var(--admin-transition);
        z-index: 200;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .admin-sidebar::-webkit-scrollbar {
        width: 4px;
      }

      .admin-sidebar::-webkit-scrollbar-thumb {
        background: var(--admin-border);
        border-radius: 2px;
      }

      .admin-sidebar-brand {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--admin-border);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: border-color var(--admin-transition);
      }

      .admin-sidebar-brand .logo {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.5px;
        color: var(--admin-text-primary);
        transition: color var(--admin-transition);
      }

      .admin-sidebar-brand .logo span {
        color: var(--admin-accent);
        background: var(--admin-accent-soft);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 12px;
        margin-left: 4px;
      }

      .admin-sidebar-brand .version {
        font-size: 10px;
        color: var(--admin-text-muted);
        font-weight: 500;
        margin-left: auto;
        transition: color var(--admin-transition);
      }

      .admin-sidebar-nav {
        flex: 1;
        padding: 12px 12px 20px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .admin-sidebar-nav .nav-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--admin-text-muted);
        padding: 12px 12px 6px;
        transition: color var(--admin-transition);
      }

      .admin-sidebar-nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-radius: var(--admin-radius);
        color: var(--admin-text-secondary);
        font-size: 13px;
        font-weight: 500;
        transition: background 0.15s, color 0.15s;
        text-decoration: none;
      }

      .admin-sidebar-nav a:hover {
        background: var(--admin-surface-2);
        color: var(--admin-text-primary);
      }

      .admin-sidebar-nav a.active {
        background: var(--admin-accent-soft);
        color: var(--admin-accent);
        font-weight: 600;
      }

      .admin-sidebar-nav a .icon {
        font-size: 16px;
        width: 24px;
        text-align: center;
        flex-shrink: 0;
      }

      .admin-sidebar-footer {
        padding: 16px 20px;
        border-top: 1px solid var(--admin-border);
        font-size: 12px;
        color: var(--admin-text-muted);
        transition: border-color var(--admin-transition), color var(--admin-transition);
      }

      .admin-sidebar-footer .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .admin-sidebar-footer .user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--admin-accent-soft);
        color: var(--admin-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
        flex-shrink: 0;
      }

      .admin-sidebar-footer .user-name {
        font-weight: 600;
        color: var(--admin-text-primary);
        transition: color var(--admin-transition);
      }

      .admin-sidebar-footer .logout-link {
        color: var(--admin-text-muted);
        text-decoration: none;
        font-size: 12px;
        margin-left: auto;
        transition: color 0.2s;
      }

      .admin-sidebar-footer .logout-link:hover {
        color: var(--admin-danger);
      }

      /* Main Content */
      .admin-main {
        margin-left: var(--admin-sidebar-width);
        flex: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        transition: margin-left 0.3s ease;
      }

      .admin-topbar {
        height: var(--admin-topbar-height);
        background: var(--admin-surface);
        border-bottom: 1px solid var(--admin-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        position: sticky;
        top: 0;
        z-index: 100;
        transition: background var(--admin-transition), border-color var(--admin-transition);
        backdrop-filter: blur(12px);
        background: rgba(var(--admin-surface-rgb, 255,255,255), 0.92);
      }

      .admin-topbar .page-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--admin-text-primary);
        transition: color var(--admin-transition);
      }

      .admin-topbar-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .admin-topbar-actions .theme-toggle {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: var(--admin-radius);
        color: var(--admin-text-secondary);
        transition: background 0.15s;
      }

      .admin-topbar-actions .theme-toggle:hover {
        background: var(--admin-surface-2);
      }

      .admin-topbar-actions .mobile-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        padding: 4px 8px;
        color: var(--admin-text-primary);
      }

      .admin-content {
        flex: 1;
        padding: 0;
      }

      /* Mobile overlay */
      .admin-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 150;
        backdrop-filter: blur(4px);
      }

      .admin-overlay.open {
        display: block;
      }

      /* Responsive */
      @media (max-width: 1024px) {
        .admin-sidebar {
          transform: translateX(-100%);
        }

        .admin-sidebar.open {
          transform: translateX(0);
        }

        .admin-main {
          margin-left: 0;
        }

        .admin-topbar-actions .mobile-toggle {
          display: block;
        }

        .admin-overlay.open {
          display: block;
        }
      }

      @media (max-width: 768px) {
        .admin-topbar {
          padding: 0 16px;
          height: 54px;
        }

        .admin-topbar .page-title {
          font-size: 14px;
        }

        .admin-sidebar {
          width: 280px;
        }

        .admin-sidebar-brand {
          padding: 16px 16px 12px;
        }

        .admin-sidebar-brand .logo {
          font-size: 18px;
        }

        .admin-sidebar-nav {
          padding: 8px 8px 16px;
        }

        .admin-sidebar-nav a {
          padding: 8px 12px;
          font-size: 12px;
        }

        .admin-sidebar-footer {
          padding: 12px 16px;
        }
      }

      @media (max-width: 480px) {
        .admin-sidebar {
          width: 100%;
          max-width: 320px;
        }

        .admin-topbar {
          padding: 0 12px;
          height: 50px;
        }

        .admin-topbar .page-title {
          font-size: 13px;
          max-width: 60%;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .admin-topbar-actions .theme-toggle {
          font-size: 16px;
          padding: 2px 6px;
        }

        .admin-topbar-actions .mobile-toggle {
          font-size: 18px;
          padding: 2px 6px;
        }
      }

      /* Print styles */
      @media print {
        .admin-sidebar,
        .admin-topbar,
        .admin-overlay {
          display: none !important;
        }

        .admin-main {
          margin-left: 0 !important;
        }

        body {
          background: #fff !important;
        }
      }

      /* Utility classes */
      .text-center { text-align: center; }
      .text-muted { color: var(--admin-text-muted); }
      .mt-1 { margin-top: 8px; }
      .mt-2 { margin-top: 16px; }
      .mt-3 { margin-top: 24px; }
      .mt-4 { margin-top: 32px; }
      .mb-1 { margin-bottom: 8px; }
      .mb-2 { margin-bottom: 16px; }
      .mb-3 { margin-bottom: 24px; }
      .mb-4 { margin-bottom: 32px; }
      .flex { display: flex; }
      .flex-center { display: flex; align-items: center; justify-content: center; }
      .flex-between { display: flex; align-items: center; justify-content: space-between; }
      .flex-wrap { flex-wrap: wrap; }
      .gap-1 { gap: 4px; }
      .gap-2 { gap: 8px; }
      .gap-3 { gap: 12px; }
      .gap-4 { gap: 16px; }
      .w-100 { width: 100%; }
      .d-none { display: none; }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar" role="navigation" aria-label="Admin Navigation">
      <div class="admin-sidebar-brand">
        <div class="logo">ABA<span>cash</span></div>
        <span class="version">Admin</span>
      </div>
      <nav class="admin-sidebar-nav">
        <div class="nav-label">Main</div>
        <a href="{% url 'platform_admin:dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
          <span class="icon"><i class="fas fa-chart-pie"></i></span> Dashboard
        </a>
        <a href="{% url 'platform_admin:company_list' %}" class="{% if request.resolver_match.url_name == 'company_list' %}active{% endif %}">
          <span class="icon"><i class="fas fa-building"></i></span> Companies
        </a>

        <div class="nav-label" style="margin-top:8px;">Public</div>
        <a href="{% url 'tenants:public_register' %}">
          <span class="icon"><i class="fas fa-user-plus"></i></span> Register
        </a>
        <a href="{% url 'tenants:landing' %}">
          <span class="icon"><i class="fas fa-home"></i></span> Home
        </a>

        <div class="nav-label" style="margin-top:8px;">System</div>
        <a href="#" onclick="return false;">
          <span class="icon"><i class="fas fa-heartbeat"></i></span> Health
        </a>
        <a href="#" onclick="return false;">
          <span class="icon"><i class="fas fa-list-ul"></i></span> Logs
        </a>
      </nav>
      <div class="admin-sidebar-footer">
        <div class="user-info">
          <div class="user-avatar">PA</div>
          <div>
            <div class="user-name">Platform Admin</div>
            <div style="font-size:10px;color:var(--admin-text-muted);">Superuser</div>
          </div>
          <a href="{% url 'tenants:public_admin_logout' %}" class="logout-link"><i class="fas fa-sign-out-alt"></i></a>
        </div>
      </div>
    </aside>

    <!-- Mobile Overlay -->
    <div class="admin-overlay" id="adminOverlay" onclick="closeAdminSidebar()"></div>

    <!-- Main Content -->
    <main class="admin-main">
      <!-- Top Bar -->
      <header class="admin-topbar">
        <div class="page-title">{% block page_title %}Platform Admin{% endblock %}</div>
        <div class="admin-topbar-actions">
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <span id="themeIcon"><i class="fas fa-moon"></i></span>
          </button>
          <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle sidebar" onclick="toggleAdminSidebar()">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </header>

      <!-- Content -->
      <div class="admin-content">
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- Scripts -->
    <script>
      (function() {
        'use strict';

        // Sidebar toggle
        window.toggleAdminSidebar = function() {
          var sidebar = document.getElementById('adminSidebar');
          var overlay = document.getElementById('adminOverlay');
          sidebar.classList.toggle('open');
          overlay.classList.toggle('open');
        };

        window.closeAdminSidebar = function() {
          var sidebar = document.getElementById('adminSidebar');
          var overlay = document.getElementById('adminOverlay');
          sidebar.classList.remove('open');
          overlay.classList.remove('open');
        };

        // Close sidebar on Escape key
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            closeAdminSidebar();
          }
        });

        // Theme toggle
        var themeToggle = document.getElementById('themeToggle');
        var themeIcon = document.getElementById('themeIcon');
        var html = document.documentElement;

        function getPreferredTheme() {
          if (localStorage.getItem('admin-theme')) {
            return localStorage.getItem('admin-theme');
          }
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            return 'dark';
          }
          return 'light';
        }

        function setTheme(theme) {
          html.setAttribute('data-theme', theme);
          localStorage.setItem('admin-theme', theme);
          if (themeIcon) {
            themeIcon.innerHTML = theme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
          }
        }

        if (themeToggle) {
          themeToggle.addEventListener('click', function() {
            var current = html.getAttribute('data-theme') || 'light';
            setTheme(current === 'dark' ? 'light' : 'dark');
          });
        }

        // Initialize theme
        var initialTheme = getPreferredTheme();
        setTheme(initialTheme);

        // Close sidebar on window resize to desktop
        var resizeTimer;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function() {
            if (window.innerWidth >= 1024) {
              closeAdminSidebar();
            }
          }, 150);
        });

        // Handle mobile toggle visibility
        var mobileToggle = document.getElementById('mobileToggle');
        if (mobileToggle) {
          mobileToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleAdminSidebar();
          });
        }

        console.log('Platform Admin base loaded.');

      })();
    </script>

    {% block extra_js %}{% endblock %}
  </body>
</html>
