<div id="quick-form-content" class="investor-form-popover">
  {% include "accounts/includes/quick_form_messages.html" %}
  <div class="investor-form-heading">
    <div>
      <div class="investor-form-kicker">Investor ledger</div>
      <h2>Record drawing</h2>
      <p>Withdraw funds from <strong>{{ investor.name }}</strong>.</p>
    </div>
    <div class="investor-form-badge">Drawing</div>
  </div>
  <div class="investor-form-panel">
    <form method="post" hx-post="{{ request.get_full_path }}" hx-target="#modal-body" hx-select="#quick-form-content" hx-swap="innerHTML">
      {% csrf_token %}
      <div class="investor-form-grid">
        <div class="investor-field">
          <label for="amount">Amount <span>*</span></label>
          <input class="form-control" id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required autofocus>
        </div>
        <div class="investor-field">
          <label for="drawing_date">Date <span>*</span></label>
          <input class="form-control" id="drawing_date" name="drawing_date" type="date" value="{% now 'Y-m-d' %}" required>
        </div>
        <div class="investor-field">
          <label for="payment_method">Paid through</label>
          <select class="form-control" id="payment_method" name="payment_method">{% for value,label in payment_method_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select>
        </div>
        <div class="investor-field">
          <label for="purpose">Purpose <small>Optional</small></label>
          <input class="form-control" type="text" id="purpose" name="purpose" placeholder="e.g. Personal withdrawal">
        </div>
        <div class="investor-field investor-field-wide">
          <label for="notes">Notes <small>Optional</small></label>
          <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Add a short internal note..."></textarea>
        </div>
      </div>
      <div class="investor-form-actions"><button type="button" class="btn btn-secondary" data-quick-form-cancel>Cancel</button><button class="btn btn-primary" type="submit">Record Drawing</button></div>
    </form>
  </div>
</div>
<style>
  .investor-form-popover { color: var(--text-primary); }
  .investor-form-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding:2px 2px 18px; }
  .investor-form-kicker { color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .investor-form-heading h2 { margin:4px 0 3px; font-size:20px; }
  .investor-form-heading p { margin:0; color:var(--text-muted); font-size:12px; }
  .investor-form-badge { border:1px solid color-mix(in srgb, var(--accent) 25%, var(--border)); border-radius:999px; color:var(--accent); font-size:11px; font-weight:700; padding:5px 10px; }
  .investor-form-panel { border:1px solid var(--border); border-radius:12px; padding:18px; background:var(--surface-2); }
  .investor-form-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }
  .investor-field { min-width:0; }
  .investor-field-wide { grid-column:1 / -1; }
  .investor-field label { margin-bottom:6px; }
  .investor-field label span { color:var(--accent); }
  .investor-field label small { color:var(--text-muted); font-size:10px; font-weight:400; margin-left:4px; }
  .investor-form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
  @media (max-width:560px) { .investor-form-grid { grid-template-columns:1fr; } .investor-field-wide { grid-column:auto; } }
</style>
